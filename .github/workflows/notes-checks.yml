name: Notes checks

on:
  push:
    branches: [control-beta]
  pull_request:
    branches: [control-beta]

permissions:
  contents: read

concurrency:
  group: notes-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    name: Notes release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Luau 0.736
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 60 --retry 2 \
            --proto '=https' --proto-redir '=https' \
            https://github.com/luau-lang/luau/releases/download/0.736/luau-ubuntu.zip \
            --output "$RUNNER_TEMP/claw-luau.zip"
          printf '%s  %s\n' '4e3d1660b044c0b7ed8b9ef3d97cbc4a1690cad98c3e71e37d86d5eb91975a61' "$RUNNER_TEMP/claw-luau.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/claw-luau.zip" -d "$RUNNER_TEMP/claw-luau"
          chmod +x "$RUNNER_TEMP/claw-luau/luau" "$RUNNER_TEMP/claw-luau/luau-compile"
      - name: Test notes and publisher
        run: |
          "$RUNNER_TEMP/claw-luau/luau-compile" --null notes-dropper.lua
          node tests/run-notes-dropper-tests.mjs --luau "$RUNNER_TEMP/claw-luau/luau"
          node --test tests/luarmor-publisher.test.mjs
          node tools/check-public.mjs
